<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MES Dashboard</title>
<style>
  :root {
    --bg: #f1f2f6;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --border: #e5e7eb;
    --text: #111827;
    --text-dim: #6b7280;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --ring: rgba(79, 70, 229, .15);
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --surface: #12151c;
      --surface-2: #171b24;
      --border: #262b36;
      --text: #e5e7eb;
      --text-dim: #8b92a3;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --danger: #f87171;
      --danger-hover: #fca5a5;
      --ring: rgba(99, 102, 241, .25);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Roboto, sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 28px;
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--ring); }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  header span.sub { color: var(--text-dim); font-size: 13px; margin-left: 4px; }

  main { padding: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }

  section {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
  }
  section.wide { grid-column: 1 / -1; }
  section .panel-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  h2 { font-size: 14px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  h2 .count { color: var(--text-dim); font-weight: 500; font-size: 12px; margin-left: 6px; }

  form {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-bottom: 16px;
    padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-dim); font-weight: 600; }

  .table-wrap { overflow-x: auto; }
  .sub-head { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 8px; }
  .sub-head:first-child { margin-top: 0; }

  input, select, textarea {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px;
    background: var(--surface); color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  input { width: 128px; }

  button {
    padding: 7px 14px; border: none; border-radius: 7px; background: var(--primary); color: #fff;
    cursor: pointer; font-size: 13px; font-weight: 600; transition: background .15s, transform .05s;
  }
  button:hover { background: var(--primary-hover); }
  button:active { transform: scale(.97); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  button.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
  td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  .row-actions { display: flex; gap: 6px; align-items: center; }
  .row-actions select { padding: 5px 6px; font-size: 12px; }
  .empty { color: var(--text-dim); text-align: center; padding: 24px !important; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
  .badge-IDLE, .badge-PLANNED { background: #e5e7eb; color: #374151; }
  .badge-RUNNING, .badge-IN_PROGRESS { background: #dcfce7; color: #15803d; }
  .badge-STOPPED, .badge-CANCELLED { background: #fee2e2; color: #b91c1c; }
  .badge-MAINTENANCE { background: #fef3c7; color: #92400e; }
  .badge-COMPLETED { background: #dbeafe; color: #1d4ed8; }
  @media (prefers-color-scheme: dark) {
    .badge-IDLE, .badge-PLANNED { background: #262b36; color: #9ca3af; }
    .badge-RUNNING, .badge-IN_PROGRESS { background: #06331f; color: #4ade80; }
    .badge-STOPPED, .badge-CANCELLED { background: #3b1414; color: #f87171; }
    .badge-MAINTENANCE { background: #3a2c06; color: #fbbf24; }
    .badge-COMPLETED { background: #0f2a4a; color: #60a5fa; }
  }

  .console-top { display: flex; gap: 8px; margin-bottom: 10px; }
  .console-top select { width: 100px; }
  .console-top input { flex: 1; width: auto; font-family: "SF Mono", Menlo, monospace; }
  .console textarea { width: 100%; height: 90px; font-family: "SF Mono", Menlo, monospace; font-size: 12px; resize: vertical; }
  .console-actions { display: flex; justify-content: flex-end; margin: 8px 0; }
  .console pre {
    background: #0b0d12; color: #d1d5db; padding: 14px; border-radius: 10px;
    max-height: 320px; overflow: auto; font-size: 12px; font-family: "SF Mono", Menlo, monospace; line-height: 1.6; margin: 0;
  }
  .console pre .ok { color: #4ade80; }
  .console pre .fail { color: #f87171; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<header><span class="dot"></span><h1>MES Dashboard</h1><span class="sub">Item · Equipment · Work Order · Production Result</span></header>
<main id="app"></main>

<script>
const app = document.getElementById('app');

// ---- generic CRUD panel (item / equipment / workOrder share this) ----
function crudPanel(cfg) {
  const section = document.createElement('section');
  section.innerHTML = `
    <div class="panel-head"><h2>${cfg.title}<span class="count" id="count-${cfg.name}"></span></h2></div>
    <form id="form-${cfg.name}"></form>
    <div class="table-wrap"><table><thead><tr>${cfg.columns.map(c => `<th>${c.label}</th>`).join('')}<th>액션</th></tr></thead>
    <tbody id="tbody-${cfg.name}"></tbody></table></div>
  `;
  app.appendChild(section);

  const form = section.querySelector(`#form-${cfg.name}`);
  cfg.createFields.forEach(f => {
    const label = document.createElement('label');
    label.className = 'field';
    label.innerHTML = `${f.label}`;
    const input = document.createElement('input');
    input.name = f.key;
    input.type = f.type || 'text';
    label.appendChild(input);
    form.appendChild(label);
  });
  const submit = document.createElement('button');
  submit.type = 'submit';
  submit.textContent = '+ 생성';
  form.appendChild(submit);

  form.onsubmit = async (e) => {
    e.preventDefault();
    const body = {};
    cfg.createFields.forEach(f => {
      const v = form.elements[f.key].value;
      body[f.key] = f.type === 'number' ? Number(v) : v;
    });
    const res = await fetch(cfg.base, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) { alert(`생성 실패 (${res.status})\n${await res.text()}`); return; }
    form.reset();
    load();
  };

  async function load() {
    const res = await fetch(cfg.listUrl || cfg.base);
    const tbody = section.querySelector(`#tbody-${cfg.name}`);
    const count = section.querySelector(`#count-${cfg.name}`);
    if (!res.ok) { tbody.innerHTML = `<tr><td colspan="99" class="err">목록 조회 실패 (${res.status})</td></tr>`; return; }
    const items = await res.json();
    count.textContent = `${items.length}건`;
    if (items.length === 0) { tbody.innerHTML = `<tr><td colspan="99" class="empty">데이터가 없습니다</td></tr>`; return; }
    tbody.innerHTML = items.map(item => `
      <tr>
        ${cfg.columns.map(c => `<td>${c.key === cfg.statusField ? `<span class="badge badge-${item[c.key]}">${item[c.key]}</span>` : (item[c.key] ?? '')}</td>`).join('')}
        <td class="row-actions">
          ${cfg.statusField ? `
            <select data-id="${item[cfg.idField]}">
              ${cfg.statusOptions.map(s => `<option value="${s}" ${s === item[cfg.statusField] ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <button data-action="status" data-id="${item[cfg.idField]}">변경</button>
          ` : ''}
          <button class="danger" data-action="delete" data-id="${item[cfg.idField]}">삭제</button>
        </td>
      </tr>
    `).join('');
  }

  section.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === 'delete') {
      if (!confirm('삭제할까요?')) return;
      const res = await fetch(`${cfg.base}/${id}`, { method: 'DELETE' });
      if (!res.ok) { alert(`삭제 실패 (${res.status})`); return; }
      load();
    }
    if (btn.dataset.action === 'status') {
      const select = btn.previousElementSibling;
      const res = await fetch(cfg.statusUrl(id, select.value), { method: 'PUT', headers: cfg.statusBody ? { 'Content-Type': 'application/json' } : {}, body: cfg.statusBody ? JSON.stringify(cfg.statusBody(select.value)) : undefined });
      if (!res.ok) { alert(`상태 변경 실패 (${res.status})`); return; }
      load();
    }
  });

  load();
}

crudPanel({
  name: 'item', title: 'Item', base: '/api/items', idField: 'itemId',
  createFields: [{ key: 'itemCode', label: '품목코드' }, { key: 'itemName', label: '품목명' }, { key: 'unit', label: '단위' }],
  columns: [{ key: 'itemId', label: 'ID' }, { key: 'itemCode', label: '코드' }, { key: 'itemName', label: '이름' }, { key: 'unit', label: '단위' }]
});

crudPanel({
  name: 'equipment', title: 'Equipment', base: '/api/equipments', idField: 'equipmentId',
  createFields: [{ key: 'equipmentCode', label: '설비코드' }, { key: 'equipmentName', label: '설비명' }],
  columns: [{ key: 'equipmentId', label: 'ID' }, { key: 'equipmentCode', label: '코드' }, { key: 'equipmentName', label: '이름' }, { key: 'status', label: '상태' }],
  statusField: 'status', statusOptions: ['IDLE', 'RUNNING', 'STOPPED', 'MAINTENANCE'],
  statusUrl: (id) => `/api/equipments/${id}`,
  statusBody: (status) => ({ status })
});

crudPanel({
  name: 'workorder', title: 'Work Order', base: '/api/work-orders', idField: 'workOrderId',
  createFields: [
    { key: 'workOrderNo', label: '지시번호' }, { key: 'itemId', label: '품목ID', type: 'number' },
    { key: 'equipmentId', label: '설비ID', type: 'number' }, { key: 'planQty', label: '계획수량', type: 'number' },
    { key: 'startDate', label: '시작일(YYYY-MM-DD)' }, { key: 'endDate', label: '종료일(YYYY-MM-DD)' }
  ],
  columns: [
    { key: 'workOrderId', label: 'ID' }, { key: 'workOrderNo', label: '지시번호' }, { key: 'itemName', label: '품목' },
    { key: 'equipmentName', label: '설비' }, { key: 'planQty', label: '수량' }, { key: 'status', label: '상태' }
  ],
  statusField: 'status', statusOptions: ['PLANNED', 'IN_PROGRESS', 'COMPLETED', 'CANCELLED'],
  statusUrl: (id, status) => `/api/work-orders/${id}/status?status=${status}`
});

// ---- production result: create + per-work-order lookup + daily summary (no list-all/delete endpoint exists) ----
function productionResultPanel() {
  const base = '/api/production-result';
  const section = document.createElement('section');
  section.innerHTML = `
    <div class="panel-head"><h2>Production Result</h2></div>
    <form id="form-pr-create"></form>

    <div class="sub-head">작업지시별 실적 조회</div>
    <form id="form-pr-lookup"></form>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>생산수량</th><th>불량수량</th><th>일자</th><th>작업자</th></tr></thead>
      <tbody id="tbody-pr-lookup"></tbody>
    </table></div>

    <div class="sub-head">일별 집계</div>
    <form id="form-pr-summary"></form>
    <div class="table-wrap"><table>
      <thead><tr><th>일자</th><th>생산수량 합</th><th>불량수량 합</th></tr></thead>
      <tbody id="tbody-pr-summary"></tbody>
    </table></div>
  `;
  app.appendChild(section);

  function addField(form, key, label, type) {
    const wrap = document.createElement('label');
    wrap.className = 'field';
    wrap.innerHTML = label;
    const input = document.createElement('input');
    input.name = key;
    input.type = type || 'text';
    wrap.appendChild(input);
    form.appendChild(wrap);
    return input;
  }

  // create
  const createForm = section.querySelector('#form-pr-create');
  const createFields = [
    { key: 'workOrderId', label: '작업지시ID', type: 'number' },
    { key: 'prodQty', label: '생산수량', type: 'number' },
    { key: 'defectQty', label: '불량수량', type: 'number' },
    { key: 'resultDate', label: '실적일자', type: 'date' },
    { key: 'workerName', label: '작업자' }
  ];
  createFields.forEach(f => addField(createForm, f.key, f.label, f.type));
  const createBtn = document.createElement('button');
  createBtn.type = 'submit';
  createBtn.textContent = '+ 등록';
  createForm.appendChild(createBtn);

  createForm.onsubmit = async (e) => {
    e.preventDefault();
    const body = {};
    createFields.forEach(f => {
      const v = createForm.elements[f.key].value;
      body[f.key] = f.type === 'number' ? Number(v) : v;
    });
    const res = await fetch(base, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) { alert(`등록 실패 (${res.status})\n${await res.text()}`); return; }
    createForm.reset();
  };

  // lookup by work order
  const lookupForm = section.querySelector('#form-pr-lookup');
  const woInput = addField(lookupForm, 'workOrderId', '작업지시ID', 'number');
  const lookupBtn = document.createElement('button');
  lookupBtn.type = 'submit';
  lookupBtn.textContent = '조회';
  lookupForm.appendChild(lookupBtn);

  lookupForm.onsubmit = async (e) => {
    e.preventDefault();
    const tbody = section.querySelector('#tbody-pr-lookup');
    if (!woInput.value) return;
    const res = await fetch(`${base}/work-order/${woInput.value}`);
    if (!res.ok) { tbody.innerHTML = `<tr><td colspan="99" class="err">조회 실패 (${res.status})</td></tr>`; return; }
    const items = await res.json();
    tbody.innerHTML = items.length ? items.map(r => `
      <tr><td>${r.resultId}</td><td>${r.prodQty}</td><td>${r.defectQty}</td><td>${r.resultDate ?? ''}</td><td>${r.workerName ?? ''}</td></tr>
    `).join('') : `<tr><td colspan="99" class="empty">데이터가 없습니다</td></tr>`;
  };

  // daily summary
  const summaryForm = section.querySelector('#form-pr-summary');
  const fromInput = addField(summaryForm, 'fromDate', '시작일', 'date');
  const toInput = addField(summaryForm, 'toDate', '종료일', 'date');
  const summaryBtn = document.createElement('button');
  summaryBtn.type = 'submit';
  summaryBtn.textContent = '집계';
  summaryForm.appendChild(summaryBtn);

  summaryForm.onsubmit = async (e) => {
    e.preventDefault();
    const tbody = section.querySelector('#tbody-pr-summary');
    if (!fromInput.value || !toInput.value) return;
    const params = new URLSearchParams({ fromDate: fromInput.value, toDate: toInput.value });
    const res = await fetch(`${base}/daily-summary?${params}`);
    if (!res.ok) { tbody.innerHTML = `<tr><td colspan="99" class="err">집계 실패 (${res.status})</td></tr>`; return; }
    const items = await res.json();
    tbody.innerHTML = items.length ? items.map(r => `
      <tr><td>${r.resultDate ?? ''}</td><td>${r.totalProdQty ?? 0}</td><td>${r.totalDefectQty ?? 0}</td></tr>
    `).join('') : `<tr><td colspan="99" class="empty">데이터가 없습니다</td></tr>`;
  };
}

productionResultPanel();

// ---- generic API console for anything the panels above don't cover ----
const consoleSection = document.createElement('section');
consoleSection.className = 'wide console';
consoleSection.innerHTML = `
  <div class="panel-head"><h2>API Console</h2></div>
  <div class="console-top">
    <select id="c-method">
      <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
    </select>
    <input id="c-path" value="/api/items">
  </div>
  <textarea id="c-body" placeholder='{"key": "value"}'></textarea>
  <div class="console-actions"><button id="c-send">전송 →</button></div>
  <pre id="c-result">응답이 여기 표시됩니다.</pre>
`;
app.appendChild(consoleSection);

document.getElementById('c-send').onclick = async () => {
  const method = document.getElementById('c-method').value;
  const path = document.getElementById('c-path').value;
  const bodyText = document.getElementById('c-body').value.trim();
  const result = document.getElementById('c-result');
  try {
    const res = await fetch(path, {
      method,
      headers: bodyText ? { 'Content-Type': 'application/json' } : {},
      body: (method === 'GET' || method === 'DELETE' || !bodyText) ? undefined : bodyText
    });
    const text = await res.text();
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch (_) {}
    const cls = res.ok ? 'ok' : 'fail';
    result.innerHTML = `<span class="${cls}">${res.status} ${res.statusText}</span>\n\n${pretty}`;
  } catch (err) {
    result.innerHTML = `<span class="fail">요청 실패: ${err}</span>`;
  }
};
</script>
</body>
</html>
